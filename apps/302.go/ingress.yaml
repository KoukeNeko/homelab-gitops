apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 302go
  annotations:
    # TLS is terminated at Cloudflare's edge and the tunnel reaches Traefik's
    # plain-HTTP entrypoint (node :80), so route on `web`, not `websecure`.
    # No cert-manager here — Cloudflare owns the public certificate.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: 302.koukeneko.cafe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 302go
                port:
                  name: http
