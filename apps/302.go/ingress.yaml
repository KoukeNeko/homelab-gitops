apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 302go
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["s.example.com"]
      secretName: 302go-tls
  rules:
    - host: s.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 302go
                port:
                  name: http
